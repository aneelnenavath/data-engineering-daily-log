version: 2

models:
  - name: stg_orders
    description: "Cleaned staging view over the raw orders seed."
    columns:
      - name: order_id
        description: "Primary key for an order."
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Customer who placed the order."
        tests:
          - not_null
      - name: status
        description: "Order fulfillment status."
        tests:
          - accepted_values:
              values: ['completed', 'pending', 'cancelled']
