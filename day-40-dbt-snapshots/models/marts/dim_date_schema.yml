version: 2

models:
  - name: dim_date
    description: "One row per calendar day for 2026, built with dbt_utils.date_spine. Used to join facts to calendar attributes like day_of_week or is_weekend."
    columns:
      - name: date_day
        description: "The calendar date."
        tests:
          - unique
          - not_null
      - name: date_key
        description: "Hashed surrogate key for date_day, built with dbt_utils.generate_surrogate_key."
        tests:
          - unique
          - not_null
